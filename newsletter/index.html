<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Legal Newsletter — PepsiCo APAC Legal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,300;0,400;0,500;0,600;0,700;0,900;1,300;1,400&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
:root {
  --pep-navy: #02355A; --pep-blue: #3680CE;
  --off-white: #f9f7f1; --page-bg: #e8f1fa;
  --border: rgba(2,53,90,0.1); --border-mid: rgba(2,53,90,0.18);
  --text-body: #2c4a62; --text-muted: #7a9ab8;
  --radius-md: 12px; --radius-lg: 18px;
  --t: 220ms cubic-bezier(0.4,0,0.2,1);
  --font-head: 'Poppins','Barlow','Arial',sans-serif;
  --font-body: 'Poppins','Barlow','Arial',sans-serif;
}
body { font-family: var(--font-body); background: var(--page-bg); color: var(--text-body); font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased; }

header { background: var(--pep-navy); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(255,255,255,0.08); }
.header-inner { padding: 0 64px; height: 62px; display: flex; align-items: center; justify-content: space-between; }
.header-brand { display: flex; align-items: center; gap: 14px; }
.header-title { font-family: var(--font-head); font-weight: 500; font-size: 16px; color: #fff; letter-spacing: 0.04em; text-transform: uppercase; }
nav { display: flex; align-items: center; gap: 2px; }
nav a { font-size: 12px; font-weight: 500; color: rgba(255,255,255,0.6); text-decoration: none; padding: 7px 14px; border-radius: 100px; letter-spacing: 0.02em; transition: background var(--t), color var(--t); }
nav a:hover, nav a.active { background: rgba(255,255,255,0.1); color: #fff; }

.page-hero { background: var(--pep-navy); padding: 56px 64px 64px; }
.page-hero-inner { max-width: 760px; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--pep-blue); margin-bottom: 10px; }
.page-hero h1 { font-family: var(--font-head); font-weight: 600; font-size: clamp(26px,3vw,38px); color: #fff; letter-spacing: -0.01em; margin-bottom: 12px; }
.page-hero p { color: rgba(255,255,255,0.65); font-weight: 300; max-width: 560px; }

main { max-width: 900px; margin: 0 auto; padding: 48px 24px 80px; }
.article-list { display: flex; flex-direction: column; gap: 16px; }
.article-card {
  display: block; background: #fff; border: 1px solid var(--border); border-radius: var(--radius-lg);
  padding: 24px 28px; text-decoration: none; color: inherit;
  transition: border-color var(--t), box-shadow var(--t), transform var(--t);
}
.article-card:hover { border-color: var(--pep-blue); box-shadow: 0 4px 8px rgba(2,53,90,.06), 0 12px 24px rgba(2,53,90,.1); transform: translateY(-1px); }
.article-tag { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--pep-blue); margin-bottom: 8px; }
.article-title { font-family: var(--font-head); font-weight: 600; font-size: 19px; color: var(--pep-navy); margin-bottom: 8px; letter-spacing: -0.01em; }
.article-excerpt { font-size: 14px; color: var(--text-body); font-weight: 300; line-height: 1.6; margin-bottom: 12px; }
.article-date { font-size: 12px; color: var(--text-muted); }
.empty-hint { text-align: center; padding: 60px 24px; color: var(--text-muted); font-size: 14px; }

footer { background: var(--pep-navy); border-top: 1px solid rgba(255,255,255,0.06); padding: 28px 64px; }
.footer-inner { display: flex; align-items: center; justify-content: space-between; }
.footer-l { font-size: 12px; font-weight: 300; color: rgba(255,255,255,0.4); }
.footer-r { font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.25); letter-spacing: 0.08em; text-transform: uppercase; }

@media (max-width: 720px) {
  .header-inner, .page-hero, footer { padding-left: 20px; padding-right: 20px; }
  nav { display: none; }
  .footer-inner { flex-direction: column; gap: 8px; align-items: flex-start; }
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="header-brand">
      <div class="header-title">PepsiCo APAC Legal</div>
    </div>
    <nav>
      <a href="/#ous">Operating Units</a>
      <a href="/newsletter/" class="active">Newsletter</a>
      <a href="/#" onclick="window.location='/';return false;">Our Team</a>
      <a href="/#" onclick="window.location='/';return false;">Legal AI</a>
    </nav>
  </div>
</header>

<div class="page-hero">
  <div class="page-hero-inner">
    <div class="eyebrow">Legal Newsletter</div>
    <h1>Latest Updates</h1>
    <p>News, guidance, and updates from the APAC Legal &amp; C&amp;E function.</p>
  </div>
</div>

<main>
  <div class="article-list" id="articleList">
    <div class="empty-hint">Loading…</div>
  </div>
</main>

<footer>
  <div class="footer-inner">
    <div class="footer-l">PepsiCo APAC Legal Front Door · For internal use only · © <span id="footerYear">2025</span> PepsiCo</div>
    <div class="footer-r">Legal Operations · APAC</div>
  </div>
</footer>

<script>
document.getElementById('footerYear').textContent = new Date().getFullYear();

const SUPABASE_URL = 'https://pweqaibadpahfprqhjdg.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_SumS4TPFIvwTvjk1VdYiwQ_LjVEDQ7l';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function escHtml(s){ if(s===null||s===undefined) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

async function loadArticles(){
  const el = document.getElementById('articleList');
  const { data, error } = await sb.from('newsletter_items')
    .select('*').eq('published', true).order('sort_order');
  if (error) { el.innerHTML = '<div class="empty-hint">Couldn\u2019t load the newsletter right now. Try refreshing.</div>'; console.error(error); return; }
  if (!data || !data.length) { el.innerHTML = '<div class="empty-hint">No newsletter articles published yet.</div>'; return; }
  el.innerHTML = data.map(n =>
    '<a class="article-card" href="/newsletter/article.html?id=' + encodeURIComponent(n.id) + '">' +
      '<div class="article-tag">' + escHtml(n.issue_label || '') + '</div>' +
      '<div class="article-title">' + escHtml(n.title) + '</div>' +
      (n.excerpt ? '<div class="article-excerpt">' + escHtml(n.excerpt) + '</div>' : '') +
      '<div class="article-date">' + escHtml(n.date_label || '') + '</div>' +
    '</a>'
  ).join('');
}
loadArticles();
</script>
</body>
</html>
