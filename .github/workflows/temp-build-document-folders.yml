name: Build document-folder widget

on:
  push:
    branches:
      - agent/nested-document-folders
    paths:
      - 'org-chart-src/**'
      - 'document-folders.js'
      - '.github/workflows/temp-build-document-folders.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'org-chart-src/**'
      - 'document-folders.js'
      - '.github/workflows/temp-build-document-folders.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/nested-document-folders

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: org-chart-src/package-lock.json

      - name: Install org chart dependencies
        working-directory: org-chart-src
        run: npm ci

      - name: Build shared widget
        working-directory: org-chart-src
        run: npm run build

      - name: Check document-folder script syntax
        run: node --check document-folders.js

      - name: Commit rebuilt widget
        shell: bash
        run: |
          if git diff --quiet -- org-chart-widget.js; then
            echo 'Widget is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add org-chart-widget.js
          git commit -m 'Build document-folder widget'
          git push
